<!DOCTYPE html>
<html>
<head>
<title>{{ title }}</title>

<style>
body {
    font-family: Arial;
    background: linear-gradient(to right, #141e30, #243b55);
    color: white;
    margin: 0;
    padding: 20px;
}

.container {
    width: 70%;
    margin: auto;
}

img {
    width: 100%;
    border-radius: 10px;
    margin: 20px 0;
}

h1 {
    color: #9be15d;
}

p {
    font-size: 16px;
    line-height: 1.6;
}

a {
    display: inline-block;
    margin: 10px 0;
    padding: 10px 15px;
    background: black;
    color: white;
    border-radius: 8px;
    text-decoration: none;
}

a:hover {
    background: orange;
}
</style>

</head>

<body>

<div class="container">

<h1>{{ title }}</h1>

{% if image %}
<img src="{{ image }}">
{% endif %}

<p>{{ description }}</p>

<!-- 📰 NEWS LINK -->
<a href="{{ url }}" target="_blank">📰 Read Full Article</a>

<br>

<!-- 🎬 YOUTUBE BUTTON -->
<a href="https://www.youtube.com/results?search_query={{ title }}" target="_blank">
▶ Watch Related Video
</a>

<br>

<!-- 🔙 BACK BUTTON -->
<a href="/">⬅ Back to Home</a>

</div>

</body>
</html>
